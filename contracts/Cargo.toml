[workspace]
resolver = "2"
members = [
  "access",
  "compliance-registry",
  "share-token",
  "asset-sale",
  "asset-exchange",
  "rewards-distributor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sabaiprotocol/sabai-stellar"

[workspace.dependencies]
soroban-sdk = "27.0.2"
sabai-access = { path = "access" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
